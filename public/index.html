<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0b1020; }
    .glass { background: rgba(17,24,39,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(148,163,184,0.15); }
    .scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <div id="app" class="min-h-screen"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, signOut
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaK5EOnATL7D5zVexeQHGp7fuyq8KJBP8",
      authDomain: "apexaiautomation.firebaseapp.com",
      projectId: "apexaiautomation",
      storageBucket: "apexaiautomation.firebasestorage.app",
      messagingSenderId: "932730992269",
      appId: "1:932730992269:web:fbbfce99bdd3857054d4c4",
      measurementId: "G-Q4YXEWS8HS"
    };

    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const googleProvider = new GoogleAuthProvider();

    const state = {
      user: null,
      token: null,
      tab: 'vault',
      vault: [],
      logs: [],
      loading: false,
      error: '',
      kvPairs: [{ key: '', value: '' }]
    };

    const $ = (sel) => document.querySelector(sel);
    function setError(msg) { state.error = msg || ''; render(); }
    function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
      const res = await fetch(path, { ...opts, headers });
      const text = await res.text();
      let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      if (!res.ok) throw new Error((data && (data.error || data.message)) || `Request failed (${res.status})`);
      return data;
    }

    async function refreshVault() {
      try {
        state.vault = await api('/api/vault');
      } catch (e) { setError(e.message); }
    }
    async function refreshLogs() {
      try {
        const data = await api('/api/agent/logs');
        state.logs = data.logs || [];
      } catch (e) { /* silent on poll */ }
    }

    function renderAuth() {
      return `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md glass rounded-2xl p-6 md:p-8 shadow-2xl">
          <div class="mb-6">
            <h1 class="text-2xl font-semibold">Automation Platform</h1>
            <p class="text-slate-400 text-sm mt-1">Sign in to manage credentials and run AI automations.</p>
          </div>
          ${state.error ? `<div class="mb-4 rounded-lg bg-red-500/10 border border-red-500/30 text-red-200 px-3 py-2 text-sm">${escapeHtml(state.error)}</div>` : ''}
          <form id="auth-form" class="space-y-3">
            <input id="email" type="email" required placeholder="Email" class="w-full rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
            <input id="password" type="password" required placeholder="Password" class="w-full rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button id="signin-btn" type="submit" class="rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2 font-medium">Sign in</button>
              <button id="signup-btn" type="button" class="rounded-lg bg-slate-700 hover:bg-slate-600 px-4 py-2 font-medium">Sign up</button>
            </div>
          </form>
          <div class="my-4 flex items-center gap-3 text-slate-500 text-xs"><div class="h-px bg-slate-700 flex-1"></div>OR<div class="h-px bg-slate-700 flex-1"></div></div>
          <button id="google-btn" class="w-full rounded-lg border border-slate-600 hover:bg-slate-800 px-4 py-2 font-medium">Continue with Google</button>
        </div>
      </div>`;
    }

    function renderKVFields() {
      return state.kvPairs.map((p, i) => `
        <div class="grid grid-cols-12 gap-2">
          <input data-k="key" data-i="${i}" value="${escapeHtml(p.key)}" placeholder="Key (e.g. apiKey)" class="col-span-5 rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2 text-sm" />
          <input data-k="value" data-i="${i}" value="${escapeHtml(p.value)}" placeholder="Value / secret" class="col-span-6 rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2 text-sm" />
          <button data-remove-kv="${i}" type="button" class="col-span-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">×</button>
        </div>`).join('');
    }

    function renderVault() {
      const items = state.vault;
      return `
      <div class="grid lg:grid-cols-2 gap-4">
        <div class="glass rounded-xl p-4 md:p-5">
          <h2 class="text-lg font-semibold mb-1">Add / Update Credential</h2>
          <p class="text-slate-400 text-sm mb-4">Secrets are encrypted client-side server-encrypted and stored in your Firestore vault. They are never listed back.</p>
          ${state.error ? `<div class="mb-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-200 px-3 py-2 text-sm">${escapeHtml(state.error)}</div>` : ''}
          <form id="vault-form" class="space-y-3">
            <div class="grid sm:grid-cols-2 gap-2">
              <input id="serviceId" placeholder="Service ID (e.g. twitter, openai)" required class="rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2" />
              <input id="label" placeholder="Label (e.g. X/Twitter Main)" required class="rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2" />
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-300">Secret fields</span>
              <button id="add-kv" type="button" class="text-sm text-brand-500 hover:text-indigo-300">+ Add field</button>
            </div>
            <div id="kv-container" class="space-y-2">${renderKVFields()}</div>
            <button class="w-full rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2 font-medium">Save credential</button>
          </form>
        </div>
        <div class="glass rounded-xl p-4 md:p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold">Connected Services</h2>
            <button id="refresh-vault" class="text-sm text-slate-300 hover:text-white">Refresh</button>
          </div>
          <div class="space-y-2 max-h-[28rem] overflow-auto scrollbar pr-1">
            ${items.length ? items.map(i => `
              <div class="rounded-lg border border-slate-700 bg-slate-900/50 p-3 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="font-medium truncate">${escapeHtml(i.label || i.serviceId)}</div>
                  <div class="text-xs text-slate-400 truncate">ID: ${escapeHtml(i.serviceId)} · Updated ${escapeHtml(i.updatedAt || '')}</div>
                </div>
                <button data-del="${escapeHtml(i.serviceId)}" class="text-sm rounded-md bg-red-500/10 text-red-300 border border-red-500/30 hover:bg-red-500/20 px-3 py-1.5">Delete</button>
              </div>`).join('') : `<div class="text-slate-400 text-sm">No credentials saved yet.</div>`}
          </div>
        </div>
      </div>`;
    }

    function statusBadge(s) {
      const map = { running: 'bg-blue-500/15 text-blue-300 border-blue-500/30', completed: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30', failed: 'bg-red-500/15 text-red-300 border-red-500/30', scheduled: 'bg-amber-500/15 text-amber-300 border-amber-500/30' };
      return `<span class="text-xs px-2 py-0.5 rounded border ${map[s]||'bg-slate-700 text-slate-200 border-slate-600'}">${escapeHtml(s)}</span>`;
    }

    function renderAgent() {
      const serviceOptions = state.vault.map(v => `<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="svc-check accent-indigo-500" value="${escapeHtml(v.serviceId)}" /> <span>${escapeHtml(v.label || v.serviceId)}</span></label>`).join('');
      return `
      <div class="grid xl:grid-cols-2 gap-4">
        <div class="glass rounded-xl p-4 md:p-5">
          <h2 class="text-lg font-semibold mb-1">Automation Agent</h2>
          <p class="text-slate-400 text-sm mb-4">Run AI automations immediately or schedule a workflow using saved vault credentials.</p>
          ${state.error ? `<div class="mb-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-200 px-3 py-2 text-sm">${escapeHtml(state.error)}</div>` : ''}
          <form id="agent-form" class="space-y-3">
            <textarea id="prompt" rows="5" required placeholder="Describe the automation task..." class="w-full rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2"></textarea>
            <div>
              <div class="text-sm text-slate-300 mb-2">Use saved credentials (optional)</div>
              <div class="grid sm:grid-cols-2 gap-2 max-h-32 overflow-auto scrollbar">${serviceOptions || '<div class="text-slate-500 text-sm">No saved services yet.</div>'}</div>
            </div>
            <div class="flex flex-wrap gap-3 items-center">
              <label class="flex items-center gap-2 text-sm text-slate-300"><input id="schedule" type="checkbox" class="accent-indigo-500" /> Schedule as workflow</label>
            </div>
            <div class="grid sm:grid-cols-2 gap-2">
              <button id="run-now" type="submit" class="rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2 font-medium">Run automation</button>
              <button id="refresh-logs" type="button" class="rounded-lg bg-slate-700 hover:bg-slate-600 px-4 py-2 font-medium">Refresh logs</button>
            </div>
          </form>
        </div>
        <div class="glass rounded-xl p-4 md:p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold">Execution Logs</h2>
            <span class="text-xs text-slate-400">Recent runs</span>
          </div>
          <div id="logs" class="space-y-2 max-h-[32rem] overflow-auto scrollbar pr-1">
            ${state.logs.length ? state.logs.map(l => `
              <div class="rounded-lg border border-slate-700 bg-slate-900/50 p-3">
                <div class="flex items-center justify-between gap-2 mb-1">
                  ${statusBadge(l.status)}
                  <span class="text-xs text-slate-400">${escapeHtml(l.updatedAt || l.createdAt || '')}</span>
                </div>
                <div class="text-sm font-medium mb-1">${escapeHtml(l.prompt)}</div>
                ${l.error ? `<pre class="text-xs text-red-200 whitespace-pre-wrap break-words bg-red-500/10 border border-red-500/20 rounded p-2 mt-2">${escapeHtml(l.error)}</pre>` : ''}
                ${l.result ? `<pre class="text-xs text-slate-200 whitespace-pre-wrap break-words bg-slate-950/60 border border-slate-800 rounded p-2 mt-2">${escapeHtml(l.result).slice(0, 4000)}</pre>` : ''}
              </div>`).join('') : `<div class="text-slate-400 text-sm">No runs yet.</div>`}
          </div>
        </div>
      </div>`;
    }

    function renderApp() {
      const userLabel = state.user?.email || state.user?.uid || 'User';
      return `
      <div class="max-w-7xl mx-auto p-4 md:p-6">
        <header class="glass rounded-2xl p-4 md:p-5 mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div>
            <h1 class="text-xl md:text-2xl font-semibold">Cloudflare Automation Platform</h1>
            <p class="text-slate-400 text-sm">Signed in as ${escapeHtml(userLabel)}</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="tab-vault" class="px-4 py-2 rounded-lg border ${state.tab==='vault'?'bg-brand-600 border-indigo-500':'bg-slate-800/60 border-slate-700 hover:bg-slate-800'}">Vault</button>
            <button id="tab-agent" class="px-4 py-2 rounded-lg border ${state.tab==='agent'?'bg-brand-600 border-indigo-500':'bg-slate-800/60 border-slate-700 hover:bg-slate-800'}">Automation Agent</button>
            <button id="logout" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600">Logout</button>
          </div>
        </header>
        <main>${state.tab === 'vault' ? renderVault() : renderAgent()}</main>
      </div>`;
    }

    function render() {
      const root = $('#app');
      if (!state.user) { root.innerHTML = renderAuth(); bindAuth(); return; }
      root.innerHTML = renderApp();
      bindApp();
    }

    function bindAuth() {
      $('#auth-form')?.addEventListener('submit', async (e) => {
        e.preventDefault(); state.error = '';
        const email = $('#email').value.trim(); const password = $('#password').value;
        try { await signInWithEmailAndPassword(auth, email, password); }
        catch (err) { setError(err.message || 'Sign in failed'); }
      });
      $('#signup-btn')?.addEventListener('click', async () => {
        state.error = '';
        const email = $('#email').value.trim(); const password = $('#password').value;
        if (!email || !password) return setError('Enter email and password to sign up.');
        try { await createUserWithEmailAndPassword(auth, email, password); }
        catch (err) { setError(err.message || 'Sign up failed'); }
      });
      $('#google-btn')?.addEventListener('click', async () => {
        state.error = '';
        try { await signInWithPopup(auth, googleProvider); }
        catch (err) { setError(err.message || 'Google sign-in failed'); }
      });
    }

    function bindApp() {
      $('#logout')?.addEventListener('click', () => signOut(auth));
      $('#tab-vault')?.addEventListener('click', async () => { state.tab='vault'; state.error=''; await refreshVault(); render(); });
      $('#tab-agent')?.addEventListener('click', async () => { state.tab='agent'; state.error=''; await Promise.all([refreshVault(), refreshLogs()]); render(); });

      if (state.tab === 'vault') {
        $('#add-kv')?.addEventListener('click', () => { state.kvPairs.push({key:'', value:''}); render(); });
        document.querySelectorAll('[data-remove-kv]').forEach(btn => btn.addEventListener('click', () => {
          const i = Number(btn.getAttribute('data-remove-kv'));
          state.kvPairs.splice(i,1); if (!state.kvPairs.length) state.kvPairs.push({key:'',value:''}); render();
        }));
        document.querySelectorAll('#kv-container input').forEach(inp => inp.addEventListener('input', (e) => {
          const i = Number(e.target.getAttribute('data-i')); const k = e.target.getAttribute('data-k');
          state.kvPairs[i][k] = e.target.value;
        }));
        $('#vault-form')?.addEventListener('submit', async (e) => {
          e.preventDefault(); state.error='';
          const serviceId = $('#serviceId').value.trim();
          const label = $('#label').value.trim();
          const secretData = {};
          for (const p of state.kvPairs) { if (p.key.trim()) secretData[p.key.trim()] = p.value; }
          if (!Object.keys(secretData).length) return setError('Add at least one secret field.');
          try {
            await api('/api/vault', { method: 'POST', body: JSON.stringify({ serviceId, label, secretData }) });
            $('#serviceId').value=''; $('#label').value=''; state.kvPairs=[{key:'',value:''}];
            await refreshVault(); render();
          } catch (err) { setError(err.message); }
        });
        document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
          const serviceId = btn.getAttribute('data-del');
          if (!confirm(`Delete credential "${serviceId}"?`)) return;
          try { await api(`/api/vault/${encodeURIComponent(serviceId)}`, { method: 'DELETE' }); await refreshVault(); render(); }
          catch (err) { setError(err.message); }
        }));
        $('#refresh-vault')?.addEventListener('click', async () => { await refreshVault(); render(); });
      }

      if (state.tab === 'agent') {
        $('#agent-form')?.addEventListener('submit', async (e) => {
          e.preventDefault(); state.error='';
          const prompt = $('#prompt').value.trim();
          const schedule = $('#schedule').checked;
          const services = Array.from(document.querySelectorAll('.svc-check:checked')).map(c => c.value);
          try {
            await api('/api/agent/run', { method: 'POST', body: JSON.stringify({ prompt, services, schedule, mode: schedule ? 'workflow' : 'immediate' }) });
            $('#prompt').value='';
            await refreshLogs(); render();
          } catch (err) { setError(err.message); }
        });
        $('#refresh-logs')?.addEventListener('click', async () => { await refreshLogs(); render(); });
      }
    }

    let pollTimer = null;
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (!state.user) return;
        if (state.tab === 'agent') { await refreshLogs(); render(); }
      }, 5000);
    }

    onAuthStateChanged(auth, async (user) => {
      state.user = user || null;
      state.error = '';
      if (user) {
        state.token = await user.getIdToken();
        await Promise.all([refreshVault(), refreshLogs()]);
        startPolling();
      } else {
        state.token = null; state.vault = []; state.logs = [];
        if (pollTimer) clearInterval(pollTimer);
      }
      render();
    });

    render();
  </script>
</body>
</html>
