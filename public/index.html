<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Automation — AI Workflow Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg:#18181b; --bg2:#222226; --bg3:#141416; --border:#2f2f35; --muted:#9ca3af; --text:#e5e7eb; --accent:#ea4b71; --accent2:#ff6d5a; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto}
    *{box-sizing:border-box}
    .scrollbar::-webkit-scrollbar{width:8px;height:8px}.scrollbar::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:9999px}
    .btn{border-radius:8px;padding:.45rem .8rem;font-weight:500;border:1px solid var(--border);background:#27272a;color:var(--text);cursor:pointer}
    .btn:hover{background:#303036}.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.05)}
    .input{width:100%;border-radius:8px;background:#141416;border:1px solid var(--border);padding:.55rem .7rem;color:var(--text)}
    .input:focus{outline:none;border-color:#52525b;box-shadow:0 0 0 2px rgba(234,75,113,.25)}
    .label{font-size:.75rem;color:var(--muted);margin-bottom:.25rem;display:block}
    .sidebar{width:260px;background:#1e1e22;border-right:1px solid var(--border);display:flex;flex-direction:column}
    .sidebar.collapsed{width:56px}
    .nav-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:8px;color:#d4d4d8;cursor:pointer}
    .nav-item:hover{background:#27272a}.nav-item.active{background:#2a2a30;color:#fff}
    #canvas-wrap{position:relative;overflow:hidden;touch-action:none;background-color:var(--bg3);background-image:radial-gradient(rgba(148,163,184,.16) 1px, transparent 1px);background-size:22px 22px}
    #canvas-world{position:absolute;top:0;left:0;transform-origin:0 0}
    #edges-svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
    .node{position:absolute;width:180px;border-radius:14px;background:#222226;border:1px solid #3f3f46;box-shadow:0 10px 30px rgba(0,0,0,.35);user-select:none;text-align:center;padding:12px 10px}
    .node.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(234,75,113,.25),0 10px 30px rgba(0,0,0,.35)}
    .node .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:20px;background:#18181b;border:1px solid #3f3f46}
    .node .port{width:12px;height:12px;border-radius:9999px;background:#52525b;border:2px solid #141416;position:absolute;top:50%;transform:translateY(-50%)}
    .node .port.in{left:-6px}.node .port.out{right:-6px;background:var(--accent);cursor:crosshair}
    .badge{font-size:10px;padding:2px 8px;border-radius:9999px;border:1px solid;display:inline-block}
    .b-idle{background:#27272a;color:#d4d4d8;border-color:#3f3f46}
    .b-running{background:rgba(59,130,246,.15);color:#93c5fd;border-color:rgba(59,130,246,.35)}
    .b-success{background:rgba(16,185,129,.15);color:#6ee7b7;border-color:rgba(16,185,129,.35)}
    .b-error{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.35)}
    .group-frame{position:absolute;border:2px dashed rgba(234,75,113,.35);border-radius:16px;background:rgba(234,75,113,.04);pointer-events:none}
    .group-label{position:absolute;top:-10px;left:12px;background:#222226;border:1px solid rgba(234,75,113,.35);color:#fda4af;font-size:11px;padding:2px 8px;border-radius:9999px}
    .drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:100%;transform:translateX(100%);transition:transform .25s ease;z-index:50}
    .drawer.open{transform:translateX(0)}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:40;display:none}
    .modal-bg.open{display:flex}
    .chat-msg{border:1px solid var(--border);background:#222226;border-radius:12px;padding:.7rem .8rem}
    .chat-msg.user{background:#27272a}
    .code-card{background:#0f0f12;border:1px solid #2f2f35;border-radius:10px;overflow:hidden}
    .pill{border:1px solid var(--border);background:#222226;color:#d4d4d8;border-radius:9999px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer}
    .pill:hover{background:#2a2a30}
    .cred-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem .6rem;border:1px solid var(--border);background:#222226;border-radius:10px}
    @media (max-width: 900px){ .sidebar{display:none} .split-right{display:none} }
  </style>
</head>
<body class="h-full">
<div id="app" class="h-full"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBaK5EOnATL7D5zVexeQHGp7fuyq8KJBP8",
  authDomain: "apexaiautomation.firebaseapp.com",
  projectId: "apexaiautomation",
  storageBucket: "apexaiautomation.firebasestorage.app",
  messagingSenderId: "932730992269",
  appId: "1:932730992269:web:fbbfce99bdd3857054d4c4",
  measurementId: "G-Q4YXEWS8HS"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const googleProvider = new GoogleAuthProvider();

const state = {
  user:null, token:null,
  nav:'assistant', view:'split', // nav: assistant|workflows|credentials|templates, view: assistant|canvas|split
  sidebarCollapsed:false,
  chats:[], activeChatId:null, chatMessages:[], chatInput:'', chatSending:false,
  requiredCredentials:[],
  vault:[], logs:[], workflows:[],
  workflow:{ id:null, name:'Untitled workflow', nodes:[], edges:[], groups:[], triggerType:'manual' },
  selectedNodeId:null, connectingFrom:null,
  pan:{x:40,y:40}, zoom:1,
  drawerOpen:false, vaultModalOpen:false, vaultPresetService:null,
  runStatus:{},
  isPointerDown:false, panStart:null, dragNode:null,
  error:'', oauthStatus:''
};

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2,10);

async function api(path, opts={}){
  const headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.token) headers['Authorization']=`Bearer ${state.token}`;
  const res=await fetch(path,{...opts,headers});
  const text=await res.text(); let data=null; try{data=text?JSON.parse(text):null;}catch{data={raw:text};}
  if(!res.ok) throw new Error((data&&(data.error||data.message))||`Request failed (${res.status})`);
  return data;
}

function isEditing(){
  const ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.isContentEditable)) return true;
  return state.drawerOpen || state.vaultModalOpen;
}

async function refreshVault(){ try{ state.vault = await api('/api/vault'); }catch{} }
async function refreshLogs(){ try{ const d=await api('/api/agent/logs'); state.logs=d.logs||[]; const latest=state.logs[0]; if(latest&&latest.nodeLogs){ try{ const map={}; for(const nl of JSON.parse(latest.nodeLogs)) map[nl.nodeId]=nl.status; state.runStatus=map; }catch{} } renderLogsOnly(); renderCanvasStatus(); }catch{} }
async function refreshWorkflows(){ try{ const d=await api('/api/agent/workflows'); state.workflows=d.workflows||[]; }catch{} }
async function refreshChats(){ try{ const d=await api('/api/agent/chats'); state.chats=d.chats||[]; renderSidebar(); }catch{} }
async function loadChat(id){
  try{ const d=await api(`/api/agent/chats/${encodeURIComponent(id)}`); state.activeChatId=d.id; state.chatMessages=d.messages||[]; // restore required creds/workflow if present in last assistant msg
    const lastA=[...state.chatMessages].reverse().find(m=>m.role==='assistant'&&m.data);
    if(lastA&&lastA.data){ if(lastA.data.workflowGraph) applyWorkflowGraph(lastA.data.workflowGraph); if(Array.isArray(lastA.data.requiredCredentials)) state.requiredCredentials=lastA.data.requiredCredentials; }
    renderChatPanel();
  }catch(e){ console.error(e); }
}

function defaultNode(type,subtype){
  const base={id:uid(),type,subtype,name:'',position:{x:120,y:120},config:{},credentialId:''};
  if(type==='trigger'){ base.name=subtype==='cron'?'Cron Schedule':subtype==='webhook'?'Webhook':'Manual Trigger'; if(subtype==='cron') base.config={cron:'0 9 * * *'}; }
  else if(type==='ai'){ base.name='Workers AI'; base.config={prompt:'{{ $json.output }}',model:'@cf/meta/llama-3.3-70b-instruct-fp8-fast',system:'You are a helpful automation agent.'}; }
  else if(type==='code'){ base.name='Code / JS Transform'; base.config={code:'// $input = previous node output, $secrets = attached credential\nreturn $input;'}; }
  else if(type==='condition'){ base.name='Condition'; base.config={expression:'$input && $input.output'}; }
  else { const names={twitter:'X/Twitter',youtube:'YouTube',gmail:'Gmail',drive:'Drive',sheets:'Sheets',telegram:'Telegram',discord:'Discord',http:'HTTP/API',webhook:'Webhook'}; base.name=names[subtype]||'Action'; base.config=(subtype==='http'||subtype==='webhook')?{url:'',method:'POST',body:'{"text":"{{ $json.output }}"}'}:{message:'{{ $json.output }}'}; }
  return base;
}
function addNode(type,subtype){
  const n=defaultNode(type,subtype); const wrap=$('#canvas-wrap');
  if(wrap){ const r=wrap.getBoundingClientRect(); n.position={x:(r.width/2-state.pan.x)/state.zoom-90,y:(r.height/2-state.pan.y)/state.zoom-40}; }
  state.workflow.nodes.push(n); state.drawerOpen=false; renderCanvas();
}
function deleteNode(id){ state.workflow.nodes=state.workflow.nodes.filter(n=>n.id!==id); state.workflow.edges=state.workflow.edges.filter(e=>e.source!==id&&e.target!==id); if(state.selectedNodeId===id){state.selectedNodeId=null;state.drawerOpen=false;} renderCanvas(); renderNodeDrawer(); }
function connectNodes(s,t){ if(s===t) return; if(state.workflow.edges.some(e=>e.source===s&&e.target===t)) return; state.workflow.edges.push({id:uid(),source:s,target:t}); }
function getNode(id){ return state.workflow.nodes.find(n=>n.id===id); }
function nodeStatus(id){ return state.runStatus[id]||'idle'; }

function applyWorkflowGraph(graph){
  if(!graph) return;
  if(Array.isArray(graph.nodes)&&graph.nodes.length){
    state.workflow.nodes = graph.nodes.map(n=>({id:n.id||uid(), type:n.type||'action', subtype:n.subtype||'', name:n.name||n.subtype||n.type, position:n.position||{x:80,y:120}, config:n.config||{}, credentialId:n.credentialId||''}));
    state.workflow.edges = Array.isArray(graph.edges)?graph.edges.map(e=>({id:e.id||uid(),source:e.source,target:e.target})):[];
    state.workflow.groups = Array.isArray(graph.groups)?graph.groups:[];
  }
  renderCanvas();
}

function connectedServices(){ return new Set((state.vault||[]).map(v=>v.serviceId)); }
function isCredConnected(req){
  const set=connectedServices(); const r=req.toLowerCase();
  const aliases={ youtube:['google_youtube','youtube'], gmail:['google_gmail','gmail'], drive:['google_drive','drive'], sheets:['google_sheets','sheets'], twitter:['twitter','x'], openai:['openai'], webhook:['webhook','custom-webhook'] };
  const keys=aliases[r]||[r,`google_${r}`]; return keys.some(k=>set.has(k));
}

function renderAuth(){
  return `<div class="min-h-screen flex items-center justify-center p-4" style="background:var(--bg)">
    <div class="w-full max-w-md rounded-2xl p-6 md:p-8" style="background:var(--bg2);border:1px solid var(--border)">
      <h1 class="text-2xl font-semibold mb-1">Automation Builder</h1>
      <p class="text-sm mb-5" style="color:var(--muted)">Sign in to build AI-powered workflows.</p>
      ${state.error?`<div class="mb-3 rounded-lg px-3 py-2 text-sm" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5">${esc(state.error)}</div>`:''}
      <form id="auth-form" class="space-y-3">
        <input id="email" type="email" required placeholder="Email" class="input" />
        <input id="password" type="password" required placeholder="Password" class="input" />
        <div class="grid grid-cols-2 gap-2"><button class="btn btn-primary" type="submit">Sign in</button><button id="signup-btn" class="btn" type="button">Sign up</button></div>
      </form>
      <div class="my-4 flex items-center gap-3 text-xs" style="color:var(--muted)"><div class="h-px flex-1" style="background:var(--border)"></div>OR<div class="h-px flex-1" style="background:var(--border)"></div></div>
      <button id="google-btn" class="w-full btn">Continue with Google</button>
    </div></div>`;
}

function renderSidebar(){
  if(!$('#sidebar')) return;
  const navs=[['assistant','✨','Assistant'],['workflows','🗂','Workflows / Overview'],['credentials','🔑','Credentials Vault'],['templates','📦','Templates']];
  const collapsed=state.sidebarCollapsed;
  $('#sidebar').className = `sidebar ${collapsed?'collapsed':''} h-full`;
  $('#sidebar').innerHTML = `
    <div class="p-3 border-b" style="border-color:var(--border)">
      <div class="flex items-center justify-between mb-2">${collapsed?'':`<div class="font-semibold text-sm">Automation</div>`}<button id="sb-toggle" class="btn !px-2 !py-1 text-xs">${collapsed?'»':'«'}</button></div>
      <button id="new-chat" class="w-full btn btn-primary text-sm ${collapsed?'!px-1':''}">${collapsed?'+':' + New Chat'}</button>
    </div>
    <nav class="p-2 space-y-1">
      ${navs.map(([k,ic,l])=>`<div data-nav="${k}" class="nav-item ${state.nav===k?'active':''}"><span>${ic}</span>${collapsed?'':`<span>${l}</span>`}</div>`).join('')}
    </nav>
    ${collapsed?'':`<div class="px-3 pt-3 pb-1 text-xs" style="color:var(--muted)">Chats</div>
    <div class="flex-1 overflow-auto scrollbar p-2 space-y-1">
      ${state.chats.length?state.chats.map(c=>`<div data-chat="${c.id}" class="nav-item ${state.activeChatId===c.id?'active':''} text-sm"><span>💬</span><span class="truncate">${esc(c.title||'Chat')}</span></div>`).join(''):`<div class="text-xs px-2" style="color:var(--muted)">No chats yet</div>`}
    </div>
    <div class="p-2 border-t" style="border-color:var(--border)"><button id="logout" class="nav-item w-full"><span>🚪</span><span>Logout</span></button></div>`}
  `;
}

function renderCodeBlocks(blocks){
  if(!Array.isArray(blocks)||!blocks.length) return '';
  return blocks.map((b,i)=>`<div class="code-card mt-2"><div class="flex items-center justify-between px-3 py-2 border-b" style="border-color:#2f2f35"><span class="text-xs" style="color:var(--muted)">${esc(b.title||b.language||'code')}</span><button data-insert-code="${i}" class="btn !py-1 !px-2 text-xs">Insert into Workflow</button></div><pre class="p-3 text-xs overflow-auto scrollbar" style="color:#d4d4d8;white-space:pre-wrap">${esc(b.code||'')}</pre></div>`).join('');
}

function renderChatMessages(){
  const c=$('#chat-messages'); if(!c) return;
  if(!state.chatMessages.length){
    c.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center p-6">
      <h2 class="text-2xl md:text-3xl font-semibold mb-4">What do you want to automate?</h2>
      <div class="w-full max-w-2xl rounded-2xl p-3" style="background:var(--bg2);border:1px solid var(--border)">
        <textarea id="hero-input" rows="3" class="input !bg-transparent !border-0" placeholder="Tell me what to build or ask a question"></textarea>
        <div class="flex justify-end mt-2"><button id="hero-send" class="btn btn-primary">Build</button></div>
      </div>
      <div class="flex flex-wrap gap-2 justify-center mt-4 max-w-3xl">
        ${['Schedule social posts','Daily YouTube uploader','AI webhook responder','Telegram / Discord bot'].map(t=>`<button class="pill" data-pill="${esc(t)}">${esc(t)}</button>`).join('')}
      </div>
    </div>`;
    return;
  }
  c.innerHTML = state.chatMessages.map((m,idx)=>{
    if(m.role==='user') return `<div class="chat-msg user"><div class="text-sm whitespace-pre-wrap">${esc(m.content||'')}</div></div>`;
    const blocks = m.data && m.data.codeBlocks ? renderCodeBlocks(m.data.codeBlocks) : '';
    return `<div class="chat-msg"><div class="text-sm whitespace-pre-wrap">${esc(m.content||m.data?.explanation||'')}</div>${blocks}</div>`;
  }).join('') + (state.chatSending?`<div class="chat-msg"><div class="text-sm" style="color:var(--muted)">Generating workflow...</div></div>`:'');
  c.scrollTop = c.scrollHeight;
}

function renderCredentialRows(){
  const c=$('#cred-rows'); if(!c) return;
  if(!state.requiredCredentials.length){ c.innerHTML=''; return; }
  const unique=[...new Set(state.requiredCredentials)];
  c.innerHTML = `<div class="p-2 space-y-2 border-t" style="border-color:var(--border);background:#1e1e22">
    <div class="text-xs px-1" style="color:var(--muted)">Required connections</div>
    ${unique.map(r=>{
      const ok=isCredConnected(r);
      return `<div class="cred-row"><div class="flex items-center gap-2 text-sm"><span>${ok?'🟢':'🔴'}</span><span>${esc(r)}</span>${ok?`<span class="badge b-success">Complete</span>`:''}</div><button data-cred-fix="${esc(r)}" class="text-sm" style="color:${ok?'#86efac':'#fca5a5'}">${ok?'Complete >':'Add connection >'}</button></div>`;
    }).join('')}
  </div>`;
}

function renderChatPanel(){
  renderChatMessages();
  renderCredentialRows();
  const inp=$('#chat-input'); if(inp && document.activeElement!==inp) inp.value = state.chatInput || '';
}

function nodeIcon(n){
  if(n.type==='trigger') return '⚡'; if(n.type==='ai') return '🧠'; if(n.type==='code') return '</>'; if(n.type==='condition') return '◇';
  const m={twitter:'𝕏',youtube:'▶',gmail:'✉',drive:'△',sheets:'▦',telegram:'✈',discord:'💬',http:'⇄',webhook:'⇄'}; return m[n.subtype]||'⚙';
}
function badge(status){ const c={idle:'b-idle',running:'b-running',success:'b-success',error:'b-error'}[status]||'b-idle'; const l={idle:'Idle',running:'Running',success:'Success',error:'Error'}[status]||'Idle'; return `<span class="badge ${c}">${l}</span>`; }

function renderCanvas(){
  const world=$('#canvas-world'); if(!world) return;
  world.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`;
  // groups
  const groups=(state.workflow.groups||[]).map(g=>{
    const nodes=(g.nodeIds||[]).map(id=>getNode(id)).filter(Boolean);
    if(!nodes.length) return '';
    const xs=nodes.map(n=>n.position.x), ys=nodes.map(n=>n.position.y);
    const x=Math.min(...xs)-20, y=Math.min(...ys)-30, w=Math.max(...xs)+210-x, h=Math.max(...ys)+120-y;
    return `<div class="group-frame" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="group-label">${esc(g.label||'Group')}</div></div>`;
  }).join('');
  const nodes=state.workflow.nodes.map(n=>{
    const st=nodeStatus(n.id), sel=state.selectedNodeId===n.id?'selected':'';
    return `<div class="node ${sel}" data-node-id="${n.id}" style="left:${n.position?.x||0}px;top:${n.position?.y||0}px">
      <div class="port in"></div><div class="port out" data-port-out="${n.id}"></div>
      <div data-drag-handle="${n.id}" class="cursor-grab active:cursor-grabbing">
        <div class="icon">${nodeIcon(n)}</div>
        <div class="text-sm font-medium truncate">${esc(n.name||n.type)}</div>
        <div class="text-[11px] truncate" style="color:var(--muted)">${esc(n.subtype||n.type)}</div>
        <div class="mt-1">${badge(st)}</div>
      </div>
    </div>`;
  }).join('');
  world.innerHTML = renderEdgesSvg()+groups+nodes;
  bindCanvasEvents();
}
function renderCanvasStatus(){ // update badges without full rebind issues
  $$('#canvas-world .node').forEach(el=>{ const id=el.getAttribute('data-node-id'); const b=el.querySelector('.badge'); if(b){ const tmp=document.createElement('div'); tmp.innerHTML=badge(nodeStatus(id)); b.replaceWith(tmp.firstChild); }});
}
function renderEdgesSvg(){
  const paths=state.workflow.edges.map(e=>{ const s=getNode(e.source),t=getNode(e.target); if(!s||!t) return '';
    const x1=(s.position?.x||0)+180,y1=(s.position?.y||0)+50,x2=(t.position?.x||0),y2=(t.position?.y||0)+50; const dx=Math.max(60,Math.abs(x2-x1)*0.5);
    const d=`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`; const st=nodeStatus(e.target); const color=st==='success'?'#10b981':st==='error'?'#ef4444':st==='running'?'#3b82f6':'#52525b';
    return `<path d="${d}" stroke="${color}" stroke-width="2.5" fill="none" marker-end="url(#arrow-${st||'idle'})" />`; }).join('');
  return `<svg id="edges-svg" width="5000" height="4000"><defs>
    ${['idle','running','success','error'].map(s=>{const c={idle:'#52525b',running:'#3b82f6',success:'#10b981',error:'#ef4444'}[s]; return `<marker id="arrow-${s}" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="${c}" /></marker>`;}).join('')}
  </defs>${paths}</svg>`;
}

function renderLogsOnly(){
  const c=$('#logs-list'); if(!c) return;
  if(!state.logs.length){ c.innerHTML=`<div class="text-sm p-2" style="color:var(--muted)">No executions yet.</div>`; return; }
  c.innerHTML = state.logs.slice(0,20).map(l=>{

function render(){
  const root=$('#app'); if(!root) return;
  if(!state.user){ root.innerHTML=renderAuth(); bindAuth(); return; }
  // Build shell once, then targeted updates to avoid wiping inputs
  if(!root.dataset.shell){
    root.innerHTML=renderApp();
    root.dataset.shell='1';
    renderSidebar(); renderChatPanel(); renderCanvas(); renderLogsOnly(); renderNodeDrawer(); renderVaultModal();
    bindGlobal();
  }
  // targeted refresh
  renderSidebar();
  // main view structure changes only when view/nav changes
  const main=$('#main');
  if(main && main.dataset.viewKey !== `${state.nav}|${state.view}`){
    main.innerHTML = renderMain();
    main.dataset.viewKey = `${state.nav}|${state.view}`;
    renderChatPanel(); renderCanvas(); renderLogsOnly();
  } else {
    const nameInp=$('#wf-name'); if(nameInp && document.activeElement!==nameInp) nameInp.value=state.workflow.name;
  }
  renderNodeDrawer(); renderVaultModal();
}

function bindAuth(){
  $('#auth-form')?.addEventListener('submit', async (e)=>{ e.preventDefault(); state.error=''; try{ await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);}catch(err){ state.error=err.message; render(); }});
  $('#signup-btn')?.addEventListener('click', async ()=>{ state.error=''; const em=$('#email').value.trim(),pw=$('#password').value; if(!em||!pw){state.error='Enter email and password.';render();return;} try{ await createUserWithEmailAndPassword(auth,em,pw);}catch(err){ state.error=err.message; render(); }});
  $('#google-btn')?.addEventListener('click', async ()=>{ state.error=''; try{ await signInWithPopup(auth,googleProvider);}catch(err){ state.error=err.message; render(); }});
}

let globalBound=false;
function bindGlobal(){
  if(globalBound) return; globalBound=true;
  document.addEventListener('click', async (e)=>{
    const t=e.target; if(!(t instanceof Element)) return;
    if(t.id==='sb-toggle'){ state.sidebarCollapsed=!state.sidebarCollapsed; renderSidebar(); }
    if(t.id==='new-chat'){ state.activeChatId=null; state.chatMessages=[]; state.requiredCredentials=[]; state.workflow={id:null,name:'Untitled workflow',nodes:[],edges:[],groups:[],triggerType:'manual'}; const main=$('#main'); if(main) main.dataset.viewKey=''; render(); }
    if(t.id==='logout'||t.closest('#logout')) signOut(auth);
    const nav=t.closest('[data-nav]'); if(nav){ state.nav=nav.getAttribute('data-nav'); if(state.nav==='credentials'){ state.vaultModalOpen=true; } const main=$('#main'); if(main) main.dataset.viewKey=''; render(); }
    const chat=t.closest('[data-chat]'); if(chat){ await loadChat(chat.getAttribute('data-chat')); }
    const view=t.closest('[data-view]'); if(view){ state.view=view.getAttribute('data-view'); const main=$('#main'); if(main) main.dataset.viewKey=''; render(); }
    if(t.id==='save-wf') saveWorkflow();
    if(t.id==='exec-wf') executeWorkflow();
    if(t.id==='add-node-btn'){ const m=$('#add-menu'); if(m) m.classList.toggle('hidden'); }
    const add=t.closest('[data-add]'); if(add){ const [tp,sp]=add.getAttribute('data-add').split(':'); addNode(tp,sp); $('#add-menu')?.classList.add('hidden'); }
    const pill=t.closest('[data-pill]'); if(pill){ sendChat(pill.getAttribute('data-pill')); }
    if(t.id==='hero-send'){ const hi=$('#hero-input'); if(hi) sendChat(hi.value); }
    if(t.id==='chat-send'){ const ci=$('#chat-input'); if(ci){ state.chatInput=ci.value; sendChat(ci.value); } }
    const ins=t.closest('[data-insert-code]'); if(ins){
      const idx=Number(ins.getAttribute('data-insert-code')); const msg=[...state.chatMessages].reverse().find(m=>m.role==='assistant'&&m.data&&m.data.codeBlocks&&m.data.codeBlocks[idx]);
      if(msg){ const b=msg.data.codeBlocks[idx]; const cn=defaultNode('code','js'); cn.config.code=b.code||''; cn.name=b.title||'Code / JS Transform'; addNodeFrom(cn); }
    }
    const credFix=t.closest('[data-cred-fix]'); if(credFix){ openVaultForService(credFix.getAttribute('data-cred-fix')); }
    if(t.id==='zoom-in'){ state.zoom=Math.min(2,state.zoom+0.1); renderCanvas(); }
    if(t.id==='zoom-out'){ state.zoom=Math.max(0.3,state.zoom-0.1); renderCanvas(); }
  });
  document.addEventListener('input',(e)=>{
    const t=e.target; if(!(t instanceof Element)) return;
    if(t.id==='wf-name') state.workflow.name=t.value;
    if(t.id==='chat-input') state.chatInput=t.value;
  });
  // Google OAuth popup result
  window.addEventListener('message', async (ev)=>{
    const d=ev.data; if(!d||d.type!=='oauth-success') return;
    if(d.saved){ await refreshVault(); }
    else if(d.secretData && d.serviceId){
      // fallback: save via vault API using user's Firebase token
      try{
        await api('/api/vault',{method:'POST', body: JSON.stringify({serviceId:d.serviceId,label:`Google ${d.service}`,secretData:d.secretData})});
        await refreshVault();
      }catch(err){ console.warn('OAuth vault save fallback failed', err); }
    }
    renderCredentialRows(); renderVaultModal();
  });
}

function openVaultForService(service){
  state.vaultModalOpen=true; state.error='';
  const map={youtube:['google_youtube','Google YouTube',[['access_token','(auto via Sign in with Google)']]], gmail:['google_gmail','Google Gmail',[['access_token','(auto)']]], drive:['google_drive','Google Drive',[['access_token','(auto)']]], sheets:['google_sheets','Google Sheets',[['access_token','(auto)']]], twitter:['twitter','X/Twitter',[['apiKey',''],['apiSecret',''],['accessToken',''],['accessSecret',''],['bearerToken','']]], openai:['openai','OpenAI',[['apiKey','']]], webhook:['custom-webhook','Custom Webhook',[['url','https://'],['method','POST'],['authorization','Bearer ']]]};
  const s=(service||'').toLowerCase().replace(/^google_/,'');

function bindCanvasEvents(){
  const wrap=$('#canvas-wrap'), world=$('#canvas-world'); if(!wrap||!world) return;
  $$('#canvas-world .node').forEach(nodeEl=>{
    const id=nodeEl.getAttribute('data-node-id');
    nodeEl.addEventListener('pointerdown',(e)=>{
      if(e.target.closest('[data-port-out]')) return;
      if(e.target.closest('[data-drag-handle]')){
        e.stopPropagation(); const n=getNode(id); if(!n) return;
        state.dragNode={id,startX:e.clientX,startY:e.clientY,orig:{...n.position}}; nodeEl.setPointerCapture?.(e.pointerId);
      }
    });
    nodeEl.addEventListener('pointermove',(e)=>{ if(state.dragNode&&state.dragNode.id===id){ const dx=(e.clientX-state.dragNode.startX)/state.zoom, dy=(e.clientY-state.dragNode.startY)/state.zoom; const n=getNode(id); n.position={x:state.dragNode.orig.x+dx,y:state.dragNode.orig.y+dy}; renderCanvas(); }});
    nodeEl.addEventListener('pointerup',()=>{ if(state.dragNode&&state.dragNode.id===id) state.dragNode=null; });
    nodeEl.addEventListener('click',(e)=>{ if(e.target.closest('[data-port-out]')||state.dragNode) return; state.selectedNodeId=id; state.drawerOpen=true; renderNodeDrawer(); });
  });
  $$('#canvas-world [data-port-out]').forEach(p=>p.addEventListener('pointerdown',(e)=>{ e.stopPropagation(); state.connectingFrom=p.getAttribute('data-port-out'); }));
  wrap.addEventListener('pointerup',(e)=>{
    if(state.connectingFrom){ const tn=e.target.closest?.('.node'); if(tn){ const tid=tn.getAttribute('data-node-id'); if(tid&&tid!==state.connectingFrom) connectNodes(state.connectingFrom,tid); } state.connectingFrom=null; renderCanvas(); }
    state.isPointerDown=false; state.panStart=null;
  });
  wrap.onpointerdown=(e)=>{ if(e.target.closest('.node')||e.target.closest('button')) return; state.isPointerDown=true; state.panStart={x:e.clientX,y:e.clientY,pan:{...state.pan}}; };
  wrap.onpointermove=(e)=>{ if(state.isPointerDown&&state.panStart&&!state.dragNode&&!state.connectingFrom){ state.pan.x=state.panStart.pan.x+(e.clientX-state.panStart.x); state.pan.y=state.panStart.pan.y+(e.clientY-state.panStart.y); const w=$('#canvas-world'); if(w) w.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`; }};
  wrap.onwheel=(e)=>{ e.preventDefault(); const delta=-e.deltaY*0.001; const nz=Math.min(2,Math.max(0.3,state.zoom+delta)); const rect=wrap.getBoundingClientRect(); const mx=e.clientX-rect.left,my=e.clientY-rect.top; const wx=(mx-state.pan.x)/state.zoom, wy=(my-state.pan.y)/state.zoom; state.zoom=nz; state.pan.x=mx-wx*state.zoom; state.pan.y=my-wy*state.zoom; renderCanvas(); },{passive:false};
  let pinch=null;
  wrap.addEventListener('touchstart',(e)=>{ if(e.touches.length===2){ const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; pinch={dist:Math.hypot(dx,dy),zoom:state.zoom}; }},{passive:true});
  wrap.addEventListener('touchmove',(e)=>{ if(e.touches.length===2&&pinch){ const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; state.zoom=Math.min(2,Math.max(0.3,pinch.zoom*(Math.hypot(dx,dy)/pinch.dist))); renderCanvas(); }},{passive:true});
  wrap.addEventListener('touchend',()=>{pinch=null;},{passive:true});
}

function bindDrawerEvents(){
  $('#nd-close')?.addEventListener('click',()=>{ state.drawerOpen=false; renderNodeDrawer(); });
  $('#nd-delete')?.addEventListener('click',()=>{ if(state.selectedNodeId) deleteNode(state.selectedNodeId); });
  $('#nd-save')?.addEventListener('click',()=>{
    const n=getNode(state.selectedNodeId); if(!n) return;
    n.name=$('#nd-name')?$('#nd-name').value:n.name; n.credentialId=$('#nd-cred')?.value||'';
    const st=$('#nd-subtype'); if(st) n.subtype=st.value;
    if(n.type==='trigger'){ if(n.subtype==='cron') n.config.cron=$('#nd-cron')?.value||'0 9 * * *'; state.workflow.triggerType=n.subtype||'manual'; }
    else if(n.type==='ai'){ n.config.model=$('#nd-model')?.value; n.config.system=$('#nd-system')?.value; n.config.prompt=$('#nd-prompt')?.value; }
    else if(n.type==='code'){ n.config.code=$('#nd-code')?.value||''; }
    else { n.config.method=$('#nd-method')?.value||'POST'; n.config.url=$('#nd-url')?.value||''; const b=$('#nd-body')?.value??''; try{ n.config.body=JSON.parse(b);}catch{ n.config.body=b; } }
    state.drawerOpen=false; renderCanvas(); renderNodeDrawer();
  });
  const nameEl=$('#nd-name'); if(!nameEl){ // inject name field at top
    const cont=$('#node-drawer .flex-1'); if(cont) cont.insertAdjacentHTML('afterbegin',`<label class="block mb-3"><span class="label">Node Name</span><input id="nd-name" class="input" value="${esc(getNode(state.selectedNodeId)?.name||'')}" /></label>`);
  }
}

function bindVaultModalEvents(presets){
  $('#vault-close')?.addEventListener('click',()=>{ state.vaultModalOpen=false; state.error=''; renderVaultModal(); });
  $('#vault-modal')?.addEventListener('click',(e)=>{ if(e.target.id==='vault-modal'){ state.vaultModalOpen=false; renderVaultModal(); } });
  $$('#vault-modal [data-gconn]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const service=btn.getAttribute('data-gconn');
    if(!state.token) return alert('Not authenticated');
    const url = `/api/oauth/google/start?service=${encodeURIComponent(service)}&token=${encodeURIComponent(state.token)}`;
    // open popup; endpoint will redirect (needs to be top-level nav in popup)
    window.open(url, 'google_oauth', 'width=520,height=700');
  }));
  $$('#vault-modal [data-preset]').forEach(btn=>btn.addEventListener('click',()=>{
    const p=presets[Number(btn.getAttribute('data-preset'))]; state._vaultKV=p.fields.map(([k,v])=>({key:k,value:v})); renderVaultModal();
    setTimeout(()=>{ const s=$('#v-serviceId'),l=$('#v-label'); if(s) s.value=p.serviceId; if(l) l.value=p.label; },0);
  }));
  $('#v-add')?.addEventListener('click',()=>{ (state._vaultKV=state._vaultKV||[{key:'',value:''}]).push({key:'',value:''}); renderVaultModal(); });
  $$('#v-kv [data-rm]').forEach(b=>b.addEventListener('click',()=>{ state._vaultKV.splice(Number(b.getAttribute('data-rm')),1); if(!state._vaultKV.length) state._vaultKV.push({key:'',value:''}); renderVaultModal(); }));
  $$('#v-kv input').forEach(inp=>inp.addEventListener('input',(e)=>{ const i=Number(e.target.getAttribute('data-i')); const k=e.target.getAttribute('data-k'); state._vaultKV[i][k]=e.target.value; }));
  $('#vault-form')?.addEventListener('submit', async (e)=>{
    e.preventDefault(); state.error='';
    const serviceId=$('#v-serviceId').value.trim(), label=$('#v-label').value.trim();
    const secretData={}; for(const p of (state._vaultKV||[])){ if(p.key.trim()) secretData[p.key.trim()]=p.value; }
    if(!Object.keys(secretData).length){ state.error='Add at least one secret field.'; renderVaultModal(); return; }
    try{ await api('/api/vault',{method:'POST',body:JSON.stringify({serviceId,label,secretData})}); state._vaultKV=[{key:'',value:''}]; await refreshVault(); renderVaultModal(); renderCredentialRows(); }
    catch(err){ state.error=err.message; renderVaultModal(); }
  });
  $$('#vault-modal [data-vdel]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const id=btn.getAttribute('data-vdel'); if(!confirm(`Delete credential "${id}"?`)) return;
    try{ await api(`/api/vault/${encodeURIComponent(id)}`,{method:'DELETE'}); await refreshVault(); renderVaultModal(); renderCredentialRows(); }catch(err){ state.error=err.message; renderVaultModal(); }
  }));
  $('#v-refresh')?.addEventListener('click', async ()=>{ await refreshVault(); renderVaultModal(); });
}

async function sendChat(text){
  const msg=(text||'').trim(); if(!msg||state.chatSending) return;
  state.chatInput=''; const ci=$('#chat-input'); if(ci) ci.value=''; const hi=$('#hero-input'); if(hi) hi.value='';
  state.chatMessages.push({role:'user',content:msg,ts:new Date().toISOString()}); state.chatSending=true; renderChatPanel();
  try{
    const history = state.chatMessages.filter(m=>m.role==='user'||m.role==='assistant').slice(-8).map(m=>({role:m.role,content:m.role==='user'?m.content:(m.content||m.data?.explanation||'')}));
    const res = await api('/api/agent/chat',{method:'POST', body: JSON.stringify({message:msg, chatId:state.activeChatId||undefined, history, workflow: state.workflow})});
    state.activeChatId = res.chatId || state.activeChatId;
    const assistant = { role:'assistant', content: res.explanation||'', data: res, ts:new Date().toISOString() };
    state.chatMessages.push(assistant);
    if(res.workflowGraph) applyWorkflowGraph(res.workflowGraph);
    if(Array.isArray(res.requiredCredentials)) state.requiredCredentials = res.requiredCredentials;
    await refreshChats();
  }catch(e){ state.chatMessages.push({role:'assistant',content:'Error: '+(e.message||'failed'),ts:new Date().toISOString()}); }
  state.chatSending=false; renderChatPanel();
}

async function saveWorkflow(){
  try{
    state.workflow.name=$('#wf-name')?.value||state.workflow.name||'Untitled workflow';
    const body={id:state.workflow.id||undefined,name:state.workflow.name,data:{nodes:state.workflow.nodes,edges:state.workflow.edges,groups:state.workflow.groups,triggerType:state.workflow.triggerType}};
    const res=await api('/api/agent/workflows',{method:'POST',body:JSON.stringify(body)}); if(res&&res.id) state.workflow.id=res.id;
    await refreshWorkflows(); alert('Workflow saved');
  }catch(e){ alert('Save failed: '+e.message); }
}

async function executeWorkflow(){
  try{
    state.runStatus={}; renderCanvas();
    state.workflow.name=$('#wf-name')?.value||state.workflow.name;
    if(!state.workflow.nodes.length){ alert('Add at least one node.'); return; }
    await api('/api/agent/run',{method:'POST', body: JSON.stringify({workflowId:state.workflow.id,workflowName:state.workflow.name,nodes:state.workflow.nodes,edges:state.workflow.edges,triggerType:state.workflow.triggerType||'manual'})});
    await refreshLogs();
  }catch(e){ alert('Execution failed: '+e.message); }
}

// Polling: pause while editing/modal/drawer/focused input; only update logs container/status
let pollTimer=null;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(async ()=>{
    if(!state.user) return; if(isEditing()) return;
    await refreshLogs();
  }, 3000);
}

onAuthStateChanged(auth, async (user)=>{
  state.user=user||null; state.error='';
  if(user){ state.token=await user.getIdToken(); await Promise.all([refreshVault(),refreshLogs(),refreshWorkflows(),refreshChats()]); startPolling(); }
  else { state.token=null; state.vault=[]; state.logs=[]; state.workflows=[]; state.chats=[]; if(pollTimer) clearInterval(pollTimer); }
  const root=$('#app'); if(root){ root.dataset.shell=''; root.innerHTML=''; }
  render();
});

render();
</script>
